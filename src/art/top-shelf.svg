<svg class="scene" viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- A wrist shot going top shelf: the stick has just let go, the puck is on
       its way to the top corner, ice spray off the blade. Ids are prefixed ts-
       because every card's art shares one page. -->
  <defs>
    <linearGradient id="ts-arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="1" stop-color="#11243a"/>
    </linearGradient>
    <linearGradient id="ts-ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f2"/>
      <stop offset="1" stop-color="#f4f9fd"/>
    </linearGradient>
    <linearGradient id="ts-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".45" stop-color="#39424f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ts-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a313b"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <radialGradient id="ts-light" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ts-mesh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 H7 M0 0 V7" stroke="#ffffff" stroke-opacity=".55" stroke-width=".8"/>
    </pattern>
  </defs>

  <!-- arena: dark stands, a few lights, the crowd as dots -->
  <rect width="400" height="170" fill="url(#ts-arena)"/>
  <g fill="#2f7fe0" opacity=".35">
    <circle cx="20" cy="38" r="2"/><circle cx="34" cy="42" r="2"/><circle cx="52" cy="37" r="2"/><circle cx="70" cy="43" r="2"/>
    <circle cx="96" cy="39" r="2"/><circle cx="118" cy="44" r="2"/><circle cx="140" cy="38" r="2"/><circle cx="166" cy="43" r="2"/>
    <circle cx="190" cy="37" r="2"/><circle cx="214" cy="42" r="2"/><circle cx="238" cy="38" r="2"/><circle cx="262" cy="44" r="2"/>
    <circle cx="288" cy="39" r="2"/><circle cx="314" cy="43" r="2"/><circle cx="340" cy="37" r="2"/><circle cx="366" cy="42" r="2"/><circle cx="388" cy="38" r="2"/>
  </g>
  <g fill="#e8463c" opacity=".3">
    <circle cx="44" cy="30" r="2"/><circle cx="108" cy="31" r="2"/><circle cx="176" cy="29" r="2"/><circle cx="250" cy="31" r="2"/><circle cx="326" cy="30" r="2"/>
  </g>
  <rect width="400" height="170" fill="url(#ts-light)"/>

  <!-- boards and glass -->
  <rect x="0" y="54" width="400" height="5" fill="#9fb8cc" opacity=".25"/>
  <rect x="0" y="59" width="400" height="17" fill="#f1f5f9"/>
  <rect x="0" y="73" width="400" height="4" fill="#ffc43d"/>

  <!-- ice, with a blue line and the edge of a faceoff circle -->
  <rect x="0" y="77" width="400" height="93" fill="url(#ts-ice)"/>
  <path d="M110 77 L60 170 L84 170 L130 77 Z" fill="#2f7fe0" opacity=".85"/>
  <ellipse cx="330" cy="150" rx="78" ry="22" fill="none" stroke="#e8463c" stroke-width="3" opacity=".7"/>
  <path d="M0 132 Q200 120 400 132" stroke="#ffffff" stroke-width="6" opacity=".5" fill="none"/>

  <!-- the net, top corner waiting -->
  <g transform="translate(286 62)">
    <path d="M6 6 L74 6 L84 14 L84 60 L0 60 L0 14 Z" fill="url(#ts-mesh)" opacity=".9"/>
    <path d="M6 6 L74 6 L84 14 L84 60 L0 60 L0 14 Z" fill="#0b1726" opacity=".35"/>
    <path d="M0 60 L0 14 Q0 4 10 4 L74 4 Q84 4 84 14 L84 60" fill="none" stroke="#e8463c" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="42" cy="61" rx="44" ry="4" fill="#0b1726" opacity=".25"/>
  </g>

  <!-- puck in flight, with its trail -->
  <g stroke="#2f7fe0" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M214 124 Q262 98 306 82" stroke-width="3"/>
    <path d="M220 132 Q266 110 300 94" stroke-width="2" opacity=".6"/>
  </g>
  <g transform="translate(314 80) rotate(-18)">
    <ellipse cx="0" cy="4" rx="12" ry="5" fill="#05070a"/>
    <rect x="-12" y="-1" width="24" height="5" fill="#05070a"/>
    <ellipse cx="0" cy="-1" rx="12" ry="5" fill="#2a313b"/>
    <ellipse cx="-3" cy="-2" rx="6" ry="2" fill="#ffffff" opacity=".18"/>
  </g>

  <!-- ice spray off the blade -->
  <g fill="#ffffff">
    <circle cx="232" cy="140" r="2.4"/><circle cx="242" cy="133" r="1.8"/><circle cx="250" cy="142" r="1.6"/>
    <circle cx="226" cy="131" r="1.4"/><circle cx="258" cy="136" r="1.2"/><circle cx="238" cy="146" r="1.6"/>
  </g>
  <path d="M206 150 Q230 138 262 140" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8" fill="none"/>

  <!-- the stick: knob of white tape, a carbon shaft with a blue graphic,
       and a curved, black-taped blade on the ice -->
  <ellipse cx="218" cy="156" rx="46" ry="5" fill="#0b1726" opacity=".25"/>
  <g transform="rotate(-37 150 80)">
    <rect x="144" y="-10" width="11" height="162" rx="3" fill="url(#ts-shaft)"/>
    <rect x="144" y="-10" width="11" height="26" rx="3" fill="#f1f5f9"/>
    <path d="M144 -2 h11 M144 4 h11 M144 10 h11" stroke="#c7d3e3" stroke-width="1.2"/>
    <rect x="144" y="70" width="11" height="34" fill="#2f7fe0"/>
    <path d="M144 96 L155 80 V88 L144 104 Z" fill="#ffffff" opacity=".9"/>
  </g>
  <!-- blade: heel at the foot of the shaft, curving up to the toe -->
  <path d="M190 140 Q192 152 206 154 L250 152 Q262 151 264 143 Q262 139 254 141 L212 143 Q202 143 199 134 Z" fill="url(#ts-blade)"/>
  <path d="M212 146 L252 144" stroke="#ffffff" stroke-width="1" opacity=".35"/>
  <path d="M206 151 L210 144 M218 151 L222 144 M230 151 L234 143 M242 150 L246 143" stroke="#ffffff" stroke-width="1" opacity=".2"/>
</svg>
