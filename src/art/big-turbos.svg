<svg class="scene" viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- A red coupe flat out at dusk: headlights on, a pop of flame from the
       exhaust, the road smearing past. Flat-shaded like the cars in the game.
       Ids prefixed bt-. -->
  <defs>
    <linearGradient id="bt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d18"/>
      <stop offset=".55" stop-color="#3a1220"/>
      <stop offset="1" stop-color="#c4442e"/>
    </linearGradient>
    <linearGradient id="bt-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2028"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="bt-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bt-flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#7cc4ff"/>
      <stop offset=".55" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e8463c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bt-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4a"/>
      <stop offset=".55" stop-color="#e3342a"/>
      <stop offset="1" stop-color="#9e1f19"/>
    </linearGradient>
    <g id="bt-wheel">
      <circle r="18" fill="#0d0f13"/>
      <circle r="12" fill="#a9b3be"/>
      <g stroke="#5d6772" stroke-width="3.2" stroke-linecap="round">
        <path d="M0 -3 V-11"/><path d="M0 -3 V-11" transform="rotate(72)"/><path d="M0 -3 V-11" transform="rotate(144)"/>
        <path d="M0 -3 V-11" transform="rotate(216)"/><path d="M0 -3 V-11" transform="rotate(288)"/>
      </g>
      <path d="M-9 -7 A11 11 0 0 1 4 -11" stroke="#e8463c" stroke-width="3" fill="none"/>
      <circle r="3.2" fill="#2b3036"/>
      <circle r="15" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 9"/>
    </g>
  </defs>

  <rect width="400" height="170" fill="url(#bt-sky)"/>
  <!-- a low sun and a city skyline on the horizon -->
  <circle cx="300" cy="118" r="34" fill="#ff8a4a" opacity=".45"/>
  <path d="M0 120 V104 h14 v-8 h12 v14 h10 v-22 h16 v18 h12 v-10 h18 v20 h8 v-28 h14 v24 h20 v-12 h12 v16 h14 v-20 h10 v8 h16 v-16 h12 v22 h18 v-10 h14 v14 h12 v-26 h16 v20 h10 v-8 h14 v12 h16 v-18 h12 v22 h14 v-12 h16 v16 V120 Z" fill="#14101a" opacity=".9"/>

  <!-- road -->
  <rect x="0" y="120" width="400" height="50" fill="url(#bt-road)"/>
  <rect x="0" y="120" width="400" height="2" fill="#e8463c" opacity=".55"/>
  <g stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M-10 164 H40"/><path d="M80 164 H150"/><path d="M196 164 H230"/><path d="M290 164 H360"/>
  </g>
  <!-- speed streaks -->
  <g stroke-linecap="round" fill="none">
    <path d="M0 96 H120" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
    <path d="M10 108 H96" stroke="#ff8a6a" stroke-opacity=".35" stroke-width="2"/>
    <path d="M0 134 H86" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M30 144 H104" stroke="#ff8a6a" stroke-opacity=".3" stroke-width="1.5"/>
  </g>

  <!-- headlight beam on the road ahead -->
  <path d="M300 112 L400 98 L400 150 Z" fill="url(#bt-beam)" opacity=".6"/>

  <!-- exhaust flame -->
  <path d="M112 133 Q96 128 58 132 Q96 138 112 138 Z" fill="url(#bt-flame)"/>
  <circle cx="111" cy="135.5" r="3" fill="#2b3036"/>

  <!-- shadow -->
  <ellipse cx="208" cy="154" rx="112" ry="5" fill="#000" opacity=".6"/>

  <!-- body -->
  <path d="M108 136 L108 118 Q108 110 116 108 L150 103 Q164 100 176 92 L194 82 Q200 79 208 79 L236 79 Q244 79 250 84 L266 97 Q276 101 296 104 Q306 106 307 114 L307 128 Q307 136 300 137 Z" fill="url(#bt-paint)"/>
  <!-- the darker flank and side skirt -->
  <path d="M112 124 L304 124 L304 134 Q300 137 296 137 L112 137 Z" fill="#7d1813"/>
  <path d="M136 124 L280 124" stroke="#ff8a7a" stroke-width="1.2" opacity=".6"/>
  <!-- glass: back window, door glass, windscreen -->
  <path d="M168 100 L190 86 Q196 83 202 83 L212 83 L212 100 Z" fill="#1a2433"/>
  <path d="M216 100 L216 83 L234 83 Q240 83 245 87 L259 100 Z" fill="#22303f"/>
  <path d="M220 84 L234 84 L228 98 L220 98 Z" fill="#ffffff" opacity=".14"/>
  <!-- wing on the boot lid -->
  <path d="M112 102 L138 98" stroke="#2b3036" stroke-width="4" stroke-linecap="round"/>
  <path d="M122 101 L124 107 M132 99 L134 105" stroke="#2b3036" stroke-width="2.5"/>
  <!-- intake ahead of the rear wheel, door line, mirror -->
  <path d="M168 112 L186 109 L186 118 L170 118 Z" fill="#5c120e"/>
  <path d="M214 102 L214 122" stroke="#7d1813" stroke-width="1.3"/>
  <path d="M258 98 L266 96 L264 102 Z" fill="#9e1f19"/>
  <!-- lights -->
  <path d="M290 106 L306 110 L306 116 L292 113 Z" fill="#fff3c4"/>
  <path d="M108 112 L118 110 L118 116 L108 117 Z" fill="#ff2d2d"/>
  <circle cx="113" cy="113.5" r="9" fill="#ff2d2d" opacity=".25"/>
  <!-- wheels, in their arches -->
  <circle cx="148" cy="134" r="21" fill="#2a0b0a"/>
  <circle cx="270" cy="134" r="21" fill="#2a0b0a"/>
  <use href="#bt-wheel" x="148" y="136"/>
  <use href="#bt-wheel" x="270" y="136"/>
</svg>
