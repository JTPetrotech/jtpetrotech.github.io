<svg class="scene" viewBox="0 0 400 170" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- A low-poly valley in the game's own palette, darkened everywhere but
       through the scope, which has a patrol bot in it next to a loot crate.
       Ids prefixed oz-. -->
  <defs>
    <linearGradient id="oz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb6c9"/>
      <stop offset="1" stop-color="#d6e5e6"/>
    </linearGradient>
    <mask id="oz-out">
      <rect width="400" height="170" fill="#fff"/>
      <circle cx="200" cy="85" r="64" fill="#000"/>
    </mask>
    <radialGradient id="oz-glass" cx=".5" cy=".5" r=".5">
      <stop offset=".75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <g id="oz-tree">
      <rect x="-1.6" y="0" width="3.2" height="7" fill="#4a3a2a"/>
      <path d="M0 -22 L9 2 H-9 Z" fill="#3f6b3a"/>
      <path d="M0 -22 L9 2 H0 Z" fill="#335a2f"/>
    </g>
  </defs>

  <!-- the valley -->
  <rect width="400" height="170" fill="url(#oz-sky)"/>
  <path d="M0 96 L40 58 L70 80 L112 40 L150 74 L186 50 L230 84 L268 46 L306 76 L344 52 L400 90 V112 H0 Z" fill="#8a9c8e"/>
  <path d="M112 40 L150 74 L120 74 Z M268 46 L306 76 L276 76 Z M186 50 L230 84 L196 84 Z M40 58 L70 80 L46 80 Z M344 52 L400 90 L352 90 Z" fill="#738679"/>
  <path d="M112 40 L122 49 L116 52 L108 46 Z M268 46 L278 55 L271 58 L262 53 Z M186 50 L195 58 L188 61 L180 57 Z" fill="#eef3f2"/>
  <path d="M0 106 L60 96 L120 104 L190 94 L260 102 L330 92 L400 100 V170 H0 Z" fill="#6f8f4a"/>
  <path d="M60 96 L120 104 L80 124 Z M190 94 L260 102 L214 122 Z M330 92 L400 100 L360 128 Z M0 106 L40 140 L0 150 Z" fill="#62803f"/>
  <path d="M120 104 L190 94 L160 136 Z M260 102 L330 92 L300 140 Z" fill="#7a9b52"/>

  <!-- a concrete outpost, trees, a crate -->
  <g>
    <rect x="34" y="84" width="40" height="24" fill="#9aa1a6"/>
    <rect x="34" y="80" width="40" height="5" fill="#7d8489"/>
    <rect x="42" y="90" width="7" height="6" fill="#2b3036"/><rect x="58" y="90" width="7" height="6" fill="#2b3036"/>
    <rect x="300" y="82" width="52" height="28" fill="#9aa1a6"/>
    <rect x="300" y="78" width="52" height="5" fill="#7d8489"/>
    <rect x="308" y="89" width="8" height="7" fill="#2b3036"/><rect x="324" y="89" width="8" height="7" fill="#2b3036"/><rect x="340" y="89" width="8" height="7" fill="#2b3036"/>
  </g>
  <use href="#oz-tree" x="96" y="104"/><use href="#oz-tree" x="110" y="110"/><use href="#oz-tree" x="140" y="100"/>
  <use href="#oz-tree" x="262" y="104"/><use href="#oz-tree" x="282" y="112"/><use href="#oz-tree" x="372" y="110"/>
  <use href="#oz-tree" x="18" y="122"/><use href="#oz-tree" x="160" y="132"/><use href="#oz-tree" x="244" y="138"/>
  <g transform="translate(226 104)">
    <rect x="0" y="0" width="14" height="11" fill="#c08a3e"/>
    <rect x="0" y="0" width="14" height="3" fill="#a5732f"/>
    <path d="M2 4 L12 10 M12 4 L2 10" stroke="#7b5320" stroke-width="1.2"/>
  </g>

  <!-- the patrol bot -->
  <g transform="translate(200 82)">
    <ellipse cx="0" cy="34" rx="14" ry="3" fill="#000" opacity=".25"/>
    <rect x="-6" y="-2" width="12" height="9" fill="#6b7680"/>
    <rect x="-5" y="1" width="10" height="3" fill="#ffb547"/>
    <rect x="-9" y="8" width="18" height="14" fill="#6b7680"/>
    <rect x="-9" y="8" width="18" height="3" fill="#5a646d"/>
    <rect x="-14" y="9" width="5" height="11" fill="#5a646d"/>
    <rect x="9" y="9" width="5" height="11" fill="#5a646d"/>
    <rect x="13" y="14" width="10" height="3" fill="#2e3439"/>
    <rect x="-7" y="22" width="5" height="11" fill="#2e3439"/>
    <rect x="2" y="22" width="5" height="11" fill="#2e3439"/>
  </g>

  <!-- everything outside the glass is in shadow -->
  <rect width="400" height="170" fill="#05080d" opacity=".66" mask="url(#oz-out)"/>
  <circle cx="200" cy="85" r="64" fill="url(#oz-glass)"/>

  <!-- reticle -->
  <g stroke="#0c1013" stroke-linecap="butt">
    <path d="M136 85 H180 M220 85 H264 M200 105 V149" stroke-width="3.4"/>
    <path d="M180 85 H220 M200 21 V105" stroke-width="1.1"/>
    <path d="M200 95 h-4 M200 100 h-3 M200 110 h-5 M200 120 h-4" stroke-width="1"/>
  </g>
  <circle cx="200" cy="85" r="2" fill="#e8463c"/>
  <!-- scope ring, a glint on the glass -->
  <circle cx="200" cy="85" r="64" fill="none" stroke="#0c1013" stroke-width="7"/>
  <circle cx="200" cy="85" r="69" fill="none" stroke="#ffb547" stroke-width="2" opacity=".7"/>
  <path d="M158 52 A54 54 0 0 1 196 33" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".45" fill="none"/>
</svg>
