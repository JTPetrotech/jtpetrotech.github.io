<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Looking down a scope at a patrol bot. The view inside the glass is the
       game's own palette: pale sky, flat green ground, a block-built robot. -->
  <defs>
    <clipPath id="oz-lens"><circle cx="60" cy="60" r="40"/></clipPath>
  </defs>
  <g clip-path="url(#oz-lens)">
    <rect x="20" y="20" width="80" height="44" fill="#a8c6d4"/>
    <path d="M20 58 L34 44 L46 54 L58 40 L74 56 L86 46 L100 58 L100 64 L20 64 Z" fill="#8a9a7c"/>
    <rect x="20" y="62" width="80" height="38" fill="#6f8f4a"/>
    <!-- bot -->
    <rect x="53" y="44" width="14" height="11" fill="#6b7680"/>
    <rect x="55" y="49" width="10" height="3" fill="#ffb547"/>
    <rect x="50" y="56" width="20" height="15" fill="#6b7680"/>
    <rect x="45" y="57" width="5" height="12" fill="#5a646d"/>
    <rect x="70" y="57" width="5" height="12" fill="#5a646d"/>
    <rect x="53" y="71" width="5" height="11" fill="#2e3439"/>
    <rect x="62" y="71" width="5" height="11" fill="#2e3439"/>
  </g>
  <!-- reticle -->
  <g stroke="#0c1013" stroke-linecap="butt">
    <path d="M20 60 H48 M72 60 H100 M60 72 V100" stroke-width="3.2"/>
    <path d="M48 60 H72 M60 20 V72" stroke-width="1"/>
  </g>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#0c1013" stroke-width="5"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#ffb547" stroke-width="2" opacity=".55"/>
